name: release

# Push a tag like v0.1.0 to publish:
#   image  ghcr.io/praveen9161/gpufit:0.1.0   (agent + controller, linux amd64/arm64)
#   chart  oci://ghcr.io/praveen9161/charts/gpufit --version 0.1.0
#   kubectl-gpufit binaries (macOS/Linux, amd64/arm64) on the GitHub release
# GHCR packages start private; make them public once (package settings) when the repo is public.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push image and chart to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gpufit
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        working-directory: agent
        run: go test ./...

      - name: Build linux binaries for the image
        working-directory: agent
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o bin/gpufit-agent-linux-$arch ./cmd/gpufit-agent
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o bin/gpufit-controller-linux-$arch ./cmd/gpufit-controller
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        # The Dockerfile only copies the prebuilt binary for TARGETARCH, so no emulation is needed.
        run: |
          tags=(-t "$IMAGE:$VERSION")
          [[ "$VERSION" == *-* ]] || tags+=(-t "$IMAGE:latest")   # pre-releases don't move latest
          docker buildx build agent --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            "${tags[@]}" --push

      - uses: azure/setup-helm@v4
      - name: Package and push chart
        run: |
          helm lint charts/gpufit
          helm package charts/gpufit --version "$VERSION" --app-version "$VERSION" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/gpufit-$VERSION.tgz" "$CHARTS"

      - name: Build kubectl-gpufit
        working-directory: agent
        run: |
          mkdir -p ../dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              d=$(mktemp -d)
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "$d/kubectl-gpufit" ./cmd/kubectl-gpufit
              cp ../LICENSE "$d/"
              tar -czf "../dist/kubectl-gpufit_${VERSION}_${os}_${arch}.tar.gz" -C "$d" kubectl-gpufit LICENSE
            done
          done
          (cd ../dist && sha256sum kubectl-gpufit_* gpufit-*.tgz > checksums.txt)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""; [[ "$VERSION" == *-* ]] && pre=--prerelease   # v0.1.0-rc.1 -> pre-release
          gh release create "$GITHUB_REF_NAME" dist/kubectl-gpufit_* dist/gpufit-*.tgz dist/checksums.txt \
            --title "GPUFit $GITHUB_REF_NAME" --generate-notes $pre
