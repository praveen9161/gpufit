apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: gpufit-lab
  name: inference-1-gpus
spec:
  spec:
    devices:
      requests:
      - name: gpus
        exactly:
          deviceClassName: gpu.example.com
          allocationMode: ExactCount
          count: 1
          selectors:
          - cel:
              # Only GPUs whose GPUFit inference score is at least 80.
              expression: device.attributes["gpufit.io"].inferenceScore >= 80
---
apiVersion: v1
kind: Pod
metadata:
  namespace: gpufit-lab
  name: inference-1
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: ctr
    image: ubuntu:24.04
    command: ["bash", "-c", "export | grep GPU_DEVICE_[0-9]*=; sleep 9999"]
    resources:
      claims:
      - name: gpus
  resourceClaims:
  - name: gpus
    resourceClaimTemplateName: inference-1-gpus
