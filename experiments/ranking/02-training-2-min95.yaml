apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: gpufit-lab
  name: training-2-strict-gpus
spec:
  spec:
    devices:
      requests:
      - name: gpus
        exactly:
          deviceClassName: gpu.example.com
          allocationMode: ExactCount
          count: 2
          selectors:
          - cel:
              expression: device.attributes["gpufit.io"].trainingScore >= 95
---
apiVersion: v1
kind: Pod
metadata:
  namespace: gpufit-lab
  name: training-2-strict
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: ctr
    image: ubuntu:24.04
    command: ["sleep", "9999"]
    resources:
      claims:
      - name: gpus
  resourceClaims:
  - name: gpus
    resourceClaimTemplateName: training-2-strict-gpus
