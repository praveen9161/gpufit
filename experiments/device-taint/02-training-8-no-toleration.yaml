apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: gpufit-lab
  name: training-8-gpus
spec:
  spec:
    devices:
      requests:
      - name: gpus
        exactly:
          deviceClassName: gpu.example.com
          allocationMode: ExactCount
          count: 8
---
apiVersion: v1
kind: Pod
metadata:
  namespace: gpufit-lab
  name: training-8
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: ctr
    image: ubuntu:24.04
    command: ["bash", "-c", "export | grep GPU_DEVICE_[0-9]*=; sleep 9999"]
    resources:
      claims:
      - name: gpus
  resourceClaims:
  - name: gpus
    resourceClaimTemplateName: training-8-gpus
