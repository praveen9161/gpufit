# Made-up GPU health for the simulated GPUs (collector=fake). Each value is a
# ratio in [0, 1]: measured / expected. Edit it to "degrade" a GPU and watch
# the agent rescore within ~5s:
#
#   kubectl edit configmap -n dra-example-driver gpufit-fake-metrics
#
# Key "<node>.json" overrides "metrics.json" for that node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpufit-fake-metrics
  namespace: dra-example-driver
data:
  metrics.json: |
    {
      "gpu-0": {"compute": 1.00, "memory": 1.00, "nvlink": 1.00, "network": 1.00, "thermal": 1.00},
      "gpu-1": {"compute": 1.00, "memory": 1.00, "nvlink": 1.00, "network": 1.00, "thermal": 1.00},
      "gpu-2": {"compute": 1.00, "memory": 1.00, "nvlink": 1.00, "network": 1.00, "thermal": 1.00},
      "gpu-3": {"compute": 1.00, "memory": 1.00, "nvlink": 0.60, "network": 1.00, "thermal": 1.00},
      "gpu-4": {"compute": 1.00, "memory": 1.00, "nvlink": 1.00, "network": 1.00, "thermal": 1.00},
      "gpu-5": {"compute": 0.80, "memory": 1.00, "nvlink": 1.00, "network": 1.00, "thermal": 0.70},
      "gpu-6": {"compute": 1.00, "memory": 1.00, "nvlink": 1.00, "network": 1.00, "thermal": 1.00},
      "gpu-7": {"compute": 1.00, "memory": 1.00, "nvlink": 1.00, "network": 1.00, "thermal": 1.00}
    }
