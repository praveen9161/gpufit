apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpufit-agent
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpufit.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpufit-agent
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpufit.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["gpufit-scores"]
  verbs: ["get", "patch"]
{{- if eq .Values.agent.collector "fake" }}
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["gpufit-fake-metrics"]
  verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpufit-agent
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpufit.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: gpufit-agent
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: gpufit-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpufit-agent
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpufit.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: gpufit, app.kubernetes.io/component: agent}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpufit
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: gpufit-agent
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (eq .Values.agent.collector "nvidia-smi") .Values.agent.runtimeClassName }}
      runtimeClassName: {{ .Values.agent.runtimeClassName }}
      {{- end }}
      {{- $sel := deepCopy .Values.agent.nodeSelector }}
      {{- if .Values.agent.gpuNodesOnly }}
      {{- $_ := set $sel "nvidia.com/gpu.present" "true" }}
      {{- end }}
      {{- with $sel }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: agent
        image: {{ include "gpufit.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - run
        - --collector={{ .Values.agent.collector }}
        - --interval={{ .Values.agent.interval }}
        {{- with .Values.agent.window }}
        - --window={{ . }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        {{- if eq .Values.agent.collector "nvidia-smi" }}
        # Mounts nvidia-smi and the driver library only (utility); the agent never
        # allocates a GPU through the scheduler.
        - {name: NVIDIA_VISIBLE_DEVICES, value: all}
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: utility}
        {{- end }}
        resources: {{- toYaml .Values.agent.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
