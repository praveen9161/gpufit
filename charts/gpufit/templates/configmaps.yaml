{{- include "gpufit.validate" . }}
# Fixed names: the agents write gpufit-scores, the controller writes gpufit-status
# (read by `kubectl gpufit status|report`). Their data is written at runtime, not by Helm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpufit-scores
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpufit.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpufit-status
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpufit.labels" . | nindent 4 }}
{{- if and (eq .Values.agent.collector "fake") .Values.agent.fakeMetrics }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpufit-fake-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "gpufit.labels" . | nindent 4 }}
data:
  metrics.json: {{ .Values.agent.fakeMetrics | quote }}
{{- end }}
